name: Lint

on:
    pull_request:
        branches: [ main, develop ]
    workflow_dispatch:

jobs:
    lint:
        name: Lint (ktlint + detekt)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: '21'
                  distribution: 'temurin'
                  cache: maven

            - name: Run ktlint
              run: mvn ktlint:check --no-transfer-progress

            - name: Run detekt
              run: mvn detekt:check --no-transfer-progress

            - name: Upload detekt report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: detekt-report
                  path: target/reports/detekt.*
